# Defaults only. Override with -Dkey=value or an environment variable (dots -> underscores, upper case),
# e.g. BASE_URL=http://localhost:3001 to test a local Restful-Booker (docker run -p 3001:3001 mwinteringham/restfulbooker).

base.url=https://restful-booker.herokuapp.com

# Restful-Booker's documented demo credentials. Override with API_USERNAME / API_PASSWORD for any real system.
api.username=admin
api.password=password123

connect.timeout.ms=10000
read.timeout.ms=30000
