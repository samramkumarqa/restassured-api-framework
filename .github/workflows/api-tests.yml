name: API Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1-5' # weekdays 08:30 IST: catches changes in the live API
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.suite }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [mock, live]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run ${{ matrix.suite }} suite
        run: mvn -B test -Dsuite=${{ matrix.suite }}

      - name: Build Allure report
        if: ${{ !cancelled() }}
        run: mvn -B -q allure:report

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: allure-${{ matrix.suite }}
          path: |
            target/site/allure-maven-plugin/
            target/surefire-reports/
          retention-days: 14
